name: UI screenshots

# Builds Nova for the simulator with test scenarios and takes screenshots
# (browser, new tab, tab overview, download assistant) – for checking the UI.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "NiceYT/**"
      - "ShareExtension/**"
      - "project.yml"
      - "project-uitests.yml"
      - "UITests/**"
      - "Tests/**"
      - ".github/workflows/ui-screenshots.yml"

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project NiceYT.xcodeproj -scheme NiceYT -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 'OTHER_SWIFT_FLAGS=$(inherited) -DNOVA_SCREENSHOTS' \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [x for k, v in d.items() if 'iOS-26' in k for x in v if x['name'].startswith('iPhone')]
          pro = [x for x in c if 'Pro' in x['name'] and 'Max' not in x['name']]
          print(sorted(pro or c, key=lambda x: x['name'])[-1]['udid'])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/NiceYT.app

      - name: Screenshots
        run: |
          mkdir -p shots
          shot() {
            local file=$1 scenario=$2 bar=$3 url=$4 wait=$5
            xcrun simctl terminate "$UDID" com.robin.niceyt || true
            SIMCTL_CHILD_NOVA_SCENARIO="$scenario" SIMCTL_CHILD_NOVA_BAR="$bar" SIMCTL_CHILD_NOVA_URL="$url" \
              SIMCTL_CHILD_NOVA_AUTOSTART="${AUTOSTART:-0}" \
              xcrun simctl launch "$UDID" com.robin.niceyt
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$file.png"
          }
          shot 00-first-launch   none      top    ""                                                                  12
          shot 01-start-top      start     top    ""                                                                  10
          shot 02-page-top       page      top    "https://de.wikipedia.org"                                          14
          shot 03-newtab-top     newtab    top    "https://de.wikipedia.org"                                          16
          shot 04-tabs-top       tabs      top    "https://de.wikipedia.org"                                          20
          shot 05-page-bottom    page      bottom "https://de.wikipedia.org"                                          14
          shot 06-newtab-bottom  newtab    bottom "https://de.wikipedia.org"                                          16
          shot 07-tiktok         assistant top    "https://www.tiktok.com/@scout2015/video/6718335390845095173"       25
          shot 08-instagram      assistant top    "https://www.instagram.com/p/aye83DjauH/"                           25
          shot 09-reddit         assistant top    "https://www.reddit.com/r/videos/comments/6rrwyj/that_small_heart_attack/" 40
          shot 10-facebook       assistant top    "https://www.facebook.com/watch/?v=10153231379946729"               40
          AUTOSTART=1 shot 11-tiktok-download assistant top "https://www.tiktok.com/@scout2015/video/6718335390845095173" 35
          cp ~/Library/Logs/DiagnosticReports/*NiceYT* shots/ 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "NiceYT"' --style compact > shots/log.txt 2>/dev/null || true
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          retention-days: 7

  ui-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Generate project with UI tests
        run: brew install xcodegen && xcodegen generate --spec project-uitests.yml

      - name: Run UI test
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [x for k, v in d.items() if 'iOS-26' in k for x in v if x['name'].startswith('iPhone')]
          pro = [x for x in c if 'Pro' in x['name'] and 'Max' not in x['name']]
          print(sorted(pro or c, key=lambda x: x['name'])[-1]['udid'])")
          xcrun simctl boot "$UDID" || true
          xcrun simctl ui "$UDID" appearance dark || true
          set -o pipefail
          xcodebuild test -project NiceYT.xcodeproj -scheme NovaUITests -destination "id=$UDID" \
            -resultBundlePath result.xcresult CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            'OTHER_SWIFT_FLAGS=$(inherited) -DNOVA_SCREENSHOTS' 2>&1 | tee test.log | grep -E "error:|Test Case|failed|passed|XCTAssert|TEST (SUCCEEDED|FAILED)" || true

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p uitest
          xcrun xcresulttool export attachments --path result.xcresult --output-path uitest || true
          cp test.log uitest/ || true
          ls -la uitest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uitest
          path: uitest
          retention-days: 7

  media:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Make test media with ffmpeg
        run: |
          command -v ffmpeg || brew install ffmpeg
          mkdir -p media && cd media
          SRC="-f lavfi -i testsrc2=duration=6:size=640x360:rate=30 -f lavfi -i sine=frequency=440:duration=6"
          ffmpeg -hide_banner -loglevel error $SRC -map 0:v -map 1:a -c:v libx264 -bf 2 -g 30 -c:a aac -b:a 128k -f mpegts h264.ts
          ffmpeg -hide_banner -loglevel error $SRC -map 0:v -map 1:a -c:v libx265 -g 30 -c:a aac -b:a 128k -f mpegts hevc.ts
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=440:duration=6 -c:a aac -f mpegts audio.ts
          for mode in timeline number single; do
            case $mode in
              timeline) FLAGS="-use_template 1 -use_timeline 1" ;;
              number) FLAGS="-use_template 1 -use_timeline 0" ;;
              single) FLAGS="-single_file 1" ;;
            esac
            mkdir -p $mode
            ffmpeg -hide_banner -loglevel error $SRC -map 0:v -map 1:a -c:v libx264 -g 30 -c:a aac \
              -f dash -seg_duration 2 $FLAGS $mode/manifest.mpd
          done
          ls -la . timeline number single
          head -c 1500 timeline/manifest.mpd

      - name: Build and run media tests
        run: |
          swiftc -swift-version 5 -O NiceYT/Browser/TSRemuxer.swift NiceYT/Browser/DASHDownloader.swift \
            Tests/MediaTests/main.swift -o mediatests
          (cd media && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          ./mediatests media
