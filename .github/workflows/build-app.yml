name: Build NiceYT IPA

on:
  push:
    branches: [main]
    paths:
      - "NiceYT/**"
      - "project.yml"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install tools
        run: brew install xcodegen ldid || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project NiceYT.xcodeproj \
            -scheme NiceYT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" -A3 build.log | head -200 || true

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/NiceYT.app
          test -d "$APP"
          # Fake-sign so TrollStore can install it directly; AltStore/Sideloadly re-sign anyway.
          if command -v ldid >/dev/null; then ldid -S "$APP/NiceYT" || true; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry NiceYT.ipa Payload
          ls -lh NiceYT.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiceYT-ipa
          path: NiceYT.ipa
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: niceyt-${{ github.run_number }}
          name: NiceYT build ${{ github.run_number }}
          body: |
            Unsignierte IPA von NiceYT (Commit ${{ github.sha }}).
            Installation per AltStore, SideStore, Sideloadly oder TrollStore – siehe README.
          files: NiceYT.ipa
          make_latest: true
